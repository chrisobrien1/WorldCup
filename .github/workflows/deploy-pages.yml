name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/world-cup-2026-app-l0ha4b, main]
  workflow_dispatch:

# Publishing to a gh-pages branch auto-enables Pages; the workflow token
# cannot create a Pages site via the API (that needs repo admin).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href=./
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/worldcup26/browser
          # don't wipe data/*.json written by refresh-data.yml
          keep_files: true
