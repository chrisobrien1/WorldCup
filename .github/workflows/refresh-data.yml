name: Refresh live data snapshot

# Server-side fetch of football-data.org (no CORS applies here), published
# as static JSON on the Pages site for the browser app to read same-origin.
# Free tier allows 10 req/min; this uses 2 every 5 minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Fetch World Cup data
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          mkdir -p data
          curl -sf --max-time 30 -H "X-Auth-Token: $TOKEN" \
            https://api.football-data.org/v4/competitions/WC/matches -o data/matches.raw.json
          curl -sf --max-time 30 -H "X-Auth-Token: $TOKEN" \
            https://api.football-data.org/v4/competitions/WC/teams -o data/teams.json
          # Stamp the snapshot with the API fetch time. The deployed app reads
          # a static file, so without this it can't tell how long ago the data
          # was actually pulled from the API.
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {fetchedAt: $t}' \
            data/matches.raw.json > data/matches.json
          rm -f data/matches.raw.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh live data snapshot"
          git push
