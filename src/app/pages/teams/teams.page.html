<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <span class="brand">TEAMS</span>
    </ion-title>
  </ion-toolbar>
  <ion-toolbar class="sub-toolbar">
    <p class="hint">
      Star your teams — their matches glow gold on the schedule.
      @if (favoriteCount() > 0) {
        <span class="count">{{ favoriteCount() }} starred</span>
      }
    </p>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="none">
    @for (group of groups(); track group.letter) {
      <ion-list-header class="group-header">
        <span>GROUP {{ group.letter }}</span>
      </ion-list-header>
      @for (team of group.teams; track team.id) {
        <ion-item button detail="false" (click)="toggle(team.id)"
                  [class.is-fav]="favorites().has(team.id)">
          <span class="flag" slot="start">{{ team.flag }}</span>
          <ion-label>
            <span class="team-name">{{ team.name }}</span>
            <span class="team-code">{{ team.code }}</span>
          </ion-label>
          <ion-icon
            slot="end"
            class="star"
            [class.starred]="favorites().has(team.id)"
            [name]="favorites().has(team.id) ? 'star' : 'star-outline'"
          ></ion-icon>
        </ion-item>
      }
    }
  </ion-list>
</ion-content>
